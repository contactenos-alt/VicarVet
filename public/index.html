<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e63439" />
    <title>VetGPT · Vicar</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="chat-app">
      <header class="chat-header">
        <h1>VetGPT</h1>
        <p>Asistente veterinario inteligente de Vicar</p>
      </header>

      <section id="chatHistory" class="chat-history" aria-live="polite">
        <article class="message bot">¡Hola! Pregúntame sobre productos y recomendaciones veterinarias de Vicar.</article>
      </section>

      <form id="chatForm" class="chat-form">
        <input
          id="questionInput"
          type="text"
          placeholder="Ej: ¿Para qué sirve el shampoo PUPPY?"
          autocomplete="off"
          required
        />
        <button id="sendButton" type="submit">Enviar</button>
      </form>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
