workflows:
  olie-android-apk:
    name: Olie Android APK (Capacitor)
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.olie.assistant"
      node: 20
      java: 17
    scripts:
      - name: Install frontend dependencies
        script: |
          cd olie-app/frontend
          npm ci
      - name: Build web app
        script: |
          cd olie-app/frontend
          npm run build:mobile
      - name: Create Android platform (if missing)
        script: |
          cd olie-app/frontend
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor Android
        script: |
          cd olie-app/frontend
          npx cap sync android
      - name: Build release APK
        script: |
          cd olie-app/frontend/android
          ./gradlew assembleRelease
    artifacts:
      - olie-app/frontend/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - build-notify@example.com
